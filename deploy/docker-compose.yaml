# 仅供本机开发；业务进程由 Go 命令启动，不用于生产部署。
# Nacos 需要先建命名空间，ID 和名字都是 dev。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${YUDAO_DEV_MYSQL_PASSWORD:?请先运行 scripts/generate-dev-env.sh}
      MYSQL_DATABASE: ruoyi-vue-pro
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
volumes:
  mysql-data:
